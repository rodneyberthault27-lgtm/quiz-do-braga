<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Braga · Painel</title>
<meta name="theme-color" content="#0B0F13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
.wrap{max-width:820px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:26px;}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;}
.cell b{display:block;font-family:var(--head);font-weight:700;font-size:30px;color:var(--gold);line-height:1;margin-bottom:4px;}
.cell span{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.linha{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:9px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.quem b{display:block;font-size:14.5px;font-weight:600;}
.quem span{font-size:12px;color:var(--dim);}
.selo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border-radius:5px;padding:4px 8px;border:1px solid;}
.selo.ok{color:#8FD3B0;border-color:var(--ok);background:rgba(76,169,122,.1);}
.selo.no{color:var(--dim);border-color:var(--line2);}
.acao{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:8px;
  color:var(--dim);font-family:inherit;font-size:12px;font-weight:600;padding:8px 13px;cursor:pointer;}
.acao:hover{border-color:var(--gold-dim);color:var(--gold);}
.acao.perigo:hover{border-color:var(--err);color:var(--err);}
.busca{margin-bottom:16px;}
.topo{display:flex;gap:14px;margin-bottom:20px;font-size:12.5px;}
.topo a{color:var(--gold);text-decoration:none;}
table.eventos{width:100%;border-collapse:collapse;font-size:12px;}
table.eventos th{text-align:left;color:var(--dim);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:10.5px;padding:7px 8px;border-bottom:1px solid var(--line);}
table.eventos td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--text);}
table.eventos td.falhou{color:var(--err);}
.vazio{color:var(--dim);font-size:13px;padding:14px 4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><a href="/app">← Voltar ao quiz</a></div>
  <div class="crest"><span class="bar"></span><span class="lbl">Painel administrativo</span></div>
  <h1>Acessos</h1>

  <div class="grid" id="resumo"></div>

  <h2 class="sec-title">Usuários</h2>
  <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou e-mail">
  <div id="lista"><div class="vazio">Carregando...</div></div>

  <h2 class="sec-title" style="margin-top:30px;">Últimos webhooks</h2>
  <div class="card" style="padding:6px 10px;">
    <table class="eventos"><tbody id="eventos"></tbody></table>
  </div>

  <div class="rodape">Quiz do Braga · painel interno</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (m) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const dia = (d) => d ? new Date(d).toLocaleDateString('pt-BR') : '—';

async function carregarResumo() {
  const r = await fetch('/api/admin/resumo');
  if (!r.ok) return;
  const s = await r.json();
  $('resumo').innerHTML = [
    [s.cadastrados, 'Cadastrados'],
    [s.liberados, 'Com acesso'],
    [s.aguardando, 'Aguardando'],
    [s.pagos, 'Pagamentos'],
  ].map(([n, r]) => `<div class="cell"><b>${n}</b><span>${r}</span></div>`).join('');
}

async function carregarUsuarios() {
  const busca = encodeURIComponent($('busca').value.trim());
  const r = await fetch('/api/admin/usuarios?busca=' + busca);
  if (!r.ok) return;
  const { usuarios } = await r.json();

  if (!usuarios.length) {
    $('lista').innerHTML = '<div class="vazio">Nenhum usuário encontrado.</div>';
    return;
  }

  $('lista').innerHTML = usuarios.map((u) => `
    <div class="linha">
      <span class="quem">
        <b>${esc(u.name || '(sem nome)')}</b>
        <span>${esc(u.email)}${u.is_admin ? ' · admin' : ''}</span>
      </span>
      <span class="selo ${u.access_enabled ? 'ok' : 'no'}">
        ${u.access_enabled ? 'Liberado ' + dia(u.access_granted_at) : 'Bloqueado'}
      </span>
      <span class="selo ${u.payment_status === 'paid' ? 'ok' : 'no'}">${esc(u.payment_status)}</span>
      <button class="acao ${u.access_enabled ? 'perigo' : ''}"
              data-id="${u.id}" data-liberar="${!u.access_enabled}">
        ${u.access_enabled ? 'Bloquear' : 'Liberar na mão'}
      </button>
    </div>`).join('');

  document.querySelectorAll('.acao[data-id]').forEach((b) => {
    b.addEventListener('click', async () => {
      const liberar = b.dataset.liberar === 'true';
      if (!confirm(liberar ? 'Liberar o acesso deste usuário?' : 'Bloquear o acesso deste usuário?')) return;
      b.disabled = true;
      const r = await fetch(`/api/admin/usuarios/${b.dataset.id}/acesso`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ liberar }),
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        alert(d.erro || 'Não foi possível alterar.');
        b.disabled = false;
        return;
      }
      await Promise.all([carregarResumo(), carregarUsuarios()]);
    });
  });
}

async function carregarEventos() {
  const r = await fetch('/api/admin/webhooks');
  if (!r.ok) return;
  const { eventos } = await r.json();
  if (!eventos.length) {
    $('eventos').innerHTML = '<tr><td class="vazio">Nenhum webhook recebido ainda.</td></tr>';
    return;
  }
  $('eventos').innerHTML =
    '<tr><th>Quando</th><th>Tópico</th><th>ID</th><th>Assinatura</th><th>Estado</th></tr>' +
    eventos.map((e) => `
      <tr>
        <td>${new Date(e.received_at).toLocaleString('pt-BR')}</td>
        <td>${esc(e.topic || '—')}</td>
        <td>${esc(e.external_id || '—')}</td>
        <td class="${e.signature_ok ? '' : 'falhou'}">${e.signature_ok ? 'válida' : 'INVÁLIDA'}</td>
        <td class="${e.error ? 'falhou' : ''}">${e.error ? esc(e.error.slice(0, 60)) : (e.processed ? 'ok' : 'pendente')}</td>
      </tr>`).join('');
}

let debounce;
$('busca').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(carregarUsuarios, 250);
});

carregarResumo();
carregarUsuarios();
carregarEventos();
</script>
</body>
</html>
