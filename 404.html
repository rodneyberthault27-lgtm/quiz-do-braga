<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada · Quiz do Braga</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F13;--panel:#161E26;--line:#2A3742;--gold:#D9A441;--gold2:#F0C36B;--text:#EDF2F5;--dim:#8D9BA6;
  --head:'Barlow Condensed',Impact,sans-serif;--body:'Public Sans',-apple-system,'Segoe UI',sans-serif;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--body);display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(800px 460px at 50% -120px,rgba(217,164,65,.12),transparent 65%);}
.caixa{max-width:460px;text-align:center;}
.marca{font-family:var(--head);font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px;}
.marca em{font-style:normal;color:var(--gold);}
h1{font-family:var(--head);font-size:clamp(38px,11vw,62px);line-height:.95;margin:0 0 14px;text-transform:uppercase;}
p{color:#B8C2C9;font-size:15px;line-height:1.6;margin:0 0 26px;}
a.btn{display:inline-block;background:var(--gold);color:#150F04;text-decoration:none;border-radius:10px;padding:15px 24px;
  font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;}
a.btn:hover{background:var(--gold2);}
.ajuda{margin-top:22px;font-size:12.5px;color:var(--dim);}
.ajuda a{color:var(--dim);}
</style>
</head>
<body>
  <main class="caixa">
    <div class="marca">Quiz do <em>Braga</em></div>
    <h1>Página não encontrada</h1>
    <p>Esse endereço não existe por aqui. Pode ser um link antigo ou um erro de digitação.</p>
    <a class="btn" href="/">Ir para o quiz</a>
    <p class="ajuda">Procurando o painel do controlador? <a href="/admin.html">Entrar no painel</a>.</p>
  </main>
</body>
</html>
